[package]
name = "achmage-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
