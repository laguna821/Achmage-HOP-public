name: 버그 신고
description: Achmage HOP에서 생긴 문제를 알려 주세요
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Achmage HOP는 HOP와 rhwp를 바탕으로 한 비공식 배포판입니다. 이 앱에서 생긴 문제는 여기에 먼저 알려 주세요.
        이 앱에만 있는 패치 때문일 수 있으므로, 원본 HOP·rhwp 저장소에는 그쪽 원본에서도 같은 문제가 확인될 때만 올려 주세요.

        개인정보가 들어 있거나 공개할 수 없는 문서는 올리지 마세요.

  - type: input
    id: version
    attributes:
      label: 버전
      description: 앱 정보 창에 보이는 버전 (예 1.0.0)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 운영체제
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 운영체제 버전
      placeholder: "예: Windows 11 24H2, macOS 15.4, Ubuntu 24.04"

  - type: textarea
    id: problem
    attributes:
      label: 무엇이 잘못됐나요
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 다시 일으키는 순서
      value: |
        1.
        2.
        3.

  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
      description: 예를 들어 같은 문서를 한글에서 열었을 때의 모습

  - type: textarea
    id: attachments
    attributes:
      label: 문서 종류와 화면 캡처
      description: 공개해도 되는 문서와 캡처만 올려 주세요. 입력 문제라면 입력기 이름도 적어 주세요.
